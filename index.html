<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🏆 DRAFT LOCAL FANTASY PRO 🏆</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0c0914; color: #e2e8f0; padding: 20px; }
        header { background: #17122b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 20px; }
        .logo { font-weight: 900; font-size: 20px; color: #38bdf8; }
        .turn-panel { background: #000; padding: 10px; border-radius: 8px; border: 1px solid #d946ef; }
        .turn-panel.hidden { display: none; }
        main { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1280px) { main { grid-template-columns: 320px 1fr 320px; } }
        .panel { background: #140f23; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; }
        h2 { font-size: 13px; color: #38bdf8; text-transform: uppercase; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #221a3f; }
        textarea, input { width: 100%; background: #000; border: 1px solid #221a3f; border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; }
        .btn { width: 100%; background: linear-gradient(90deg, #3b82f6, #d946ef); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-undo { background: #f59e0b; margin-top: 5px; }
        .btn-clear { background: #ef4444; margin-top: 5px; }
        .scroll { overflow-y: auto; max-height: 600px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { background: #221a3f; border: none; color: #94a3b8; padding: 8px; border-radius: 6px; cursor: pointer; flex-grow: 1; }
        .tab.active { background: #38bdf8; color: #000; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
        .card { background: rgba(255,255,255,0.02); border: 1px solid #221a3f; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-fichar { background: #221a3f; border: 1px solid #38bdf8; color: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .history-item { background: #000; padding: 8px; border-radius: 6px; font-size: 12px; border-left: 3px solid #38bdf8; margin-bottom: 5px; }
        .team-box { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #221a3f; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🏆 ENGINE DRAFT LOCAL FANTASY</div>
        <div id="turn-indicator" class="turn-panel hidden">
            <small id="round-number" style="font-size:10px; color:#94a3b8; display:block;">RONDA 1 / 23</small>
            <strong id="current-drafter" style="color:#fff; font-size:14px;">Listo...</strong>
            <span id="direction-tag" style="font-size:11px; margin-left:10px;">IDA</span>
        </div>
    </header>
    <main>
        <section class="panel" id="admin-setup-panel">
            <h2>⚙️ Cargar Base de Datos Excel</h2>
            <textarea id="players-input" rows="6" placeholder="Pega aquí tus columnas de Excel (Nombre, Equipo, Posición)."></textarea>
            <button onclick="initLocalDraft()" id="btn-start" class="btn">🚀 Cargar 700 Jugadores</button>
        </section>
        <section class="panel">
            <div class="tabs">
                <button id="tab-market" class="tab active" onclick="switchTab('market')">🛒 Mercado (<span id="pool-count">0</span>)</button>
                <button id="tab-teams" class="tab" onclick="switchTab('teams')">👥 Plantillas</button>
            </div>
            <input type="text" id="search-player" oninput="filterPlayers()" placeholder="🔍 Escribe para buscar por nombre o equipo..." style="margin-bottom:10px;">
            <div id="main-container" class="scroll"><div id="players-pool" class="grid"></div></div>
            <button onclick="undoLocalPick()" id="btn-undo" class="btn btn-undo hidden">↩️ Deshacer Último Fichaje</button>
            <button onclick="hardLocalReset()" id="btn-reset-total" class="btn btn-clear hidden">🚨 RESETEAR LIGA COMPLETA</button>
        </section>
        <section class="panel"><h2>📜 Historial de Picks</h2><div id="draft-history" class="scroll"></div></section>
    </main>
    <script>
        let managers = ["Las Palmas (Turu Flores)", "Oviedo (Obafemi)", "Real Sociedad (Omar Little)", "Osasuna (Sens44)", "Huracán (Trosky)", "Levante (Celtics Fan)", "Lleida (Boibi2)", "Recreativo (JOSEDIN)", "Sporting (Rebekin)", "Celta (William)", "Guadalajara (Nikola Sarcevic)", "Deportivo (De la Penya)", "Valencia (Jraga)", "Barcelona (Malabar)", "Marino (Sauber)", "Eibar (Eragon86)", "Real Unión (Swes)", "Cadiz (Aitor55)", "Coruxo (Hill)", "Alaves (Torressss)"];
        let players = [], history = [], teams = {}, currentManagerIndex = 0, currentRound = 1, activeTab = 'market';

        function processText(rawText) {
            let lines = rawText.replace(/\r/g, "").split('\n'); let list = [];
            lines.forEach(line => {
                if (!line.trim()) return;
                let parts = line.split('\t');
                if (parts.length < 2) parts = line.split(',');
                let name = parts ? parts.trim() : "";
                let team = parts ? parts.trim() : "Libre";
                let pos = parts ? parts.trim().toUpperCase() : "MED";
                if (!name) return;
                list.push({ name: name, team: team, pos: pos });
            });
            return list;
        }

        function initLocalDraft() {
            let raw = document.getElementById('players-input').value;
            let pool = processText(raw); if (!pool.length) { alert("Pega filas válidas."); return; }
            let emptyTeams = {}; managers.forEach(m => emptyTeams[m] = []);
            let data = { players: pool, history: [{ manager: "Comisionado", name: "Draft Iniciado", team: "LaLiga", pos: "MED", round: 0 }], teams: emptyTeams, currentRound: 1, currentManagerIndex: 0 };
            localStorage.setItem('firme_backup_liga', JSON.stringify(data));
            loadFromObject(data);
        }

        function loadFromObject(data) {
            players = data.players || []; history = data.history || []; teams = data.teams || {};
            currentRound = data.currentRound || 1; currentManagerIndex = data.currentManagerIndex || 0;
            document.getElementById('admin-setup-panel').style.display = "none";
            document.getElementById('turn-indicator').classList.remove('hidden');
            document.getElementById('btn-undo').classList.remove('hidden');
            document.getElementById('btn-reset-total').classList.remove('hidden');
            updateUI();
        }

        function pickPlayer(idx) {
            let p = players[idx], m = managers[currentManagerIndex];
            history.unshift({ manager: m, name: p.name, team: p.team, pos: p.pos, round: currentRound });
            if (!teams[m]) teams[m] = []; teams[m].push({ player: p.name, pos: p.pos });
            players.splice(idx, 1);
            if (currentRound % 2 !== 0) { if (currentManagerIndex === managers.length - 1) currentRound++; else currentManagerIndex++; }
            else { if (currentManagerIndex === 0) currentRound++; else currentManagerIndex--; }
            localStorage.setItem('firme_backup_liga', JSON.stringify({ players, history, teams, currentRound, currentManagerIndex }));
            updateUI();
        }

        function undoLocalPick() {
            if (history.length <= 1) return;
            let last = history.shift(); players.push({ name: last.name, team: last.team, pos: last.pos });
            teams[last.manager] = teams[last.manager].filter(p => p.player !== last.name);
            currentRound = last.round; currentManagerIndex = managers.indexOf(last.manager);
            localStorage.setItem('firme_backup_liga', JSON.stringify({ players, history, teams, currentRound, currentManagerIndex }));
            updateUI();
        }

        function hardLocalReset() { if (confirm("¿Borrar todo?")) { localStorage.clear(); window.location.reload(); } }
        function switchTab(t) { activeTab = t; updateUI(); }
        function filterPlayers() { renderMarket(); }

        function updateUI() {
            document.getElementById('pool-count').innerText = players.length;
            document.getElementById('round-number').innerText = `Ronda ${currentRound} / 23`;
            document.getElementById('current-drafter').innerText = managers[currentManagerIndex] || "COMPLETO";
            document.getElementById('direction-tag').innerText = currentRound % 2 !== 0 ? "Ida ➡️" : "Vuelta ⬅️";
            if (activeTab === 'market') renderMarket(); else renderLiveTeams();
            renderHistory();
        }

        function renderMarket() {
            let search = document.getElementById('search-player').value.toLowerCase().trim();
            let pool = document.getElementById('players-pool'); pool.innerHTML = "";
            let filtered = players.filter(p => p.name.toLowerCase().includes(search) || p.team.toLowerCase().includes(search));
            filtered.forEach(p => {
                let idx = players.indexOf(p);
                let div = document.createElement('div'); div.className = "card";
                div.innerHTML = `<div><strong>${p.name}</strong> [${p.pos}]<br><small style="color:#94a3b8">${p.team}</small></div><button class="btn-fichar" onclick="pickPlayer(${idx})">Fichar</button>`;
                pool.appendChild(div);
            });
        }

        function renderLiveTeams() {
            let pool = document.getElementById('players-pool'); pool.innerHTML = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%;" id="s-grid"></div>';
            let grid = document.getElementById('s-grid');
            managers.forEach(m => {
                let html = `<div class="team-box"><h4>👤 ${m}</h4><ul style="list-style:none; font-size:11px; margin-top:5px;">`;
                let mPlayers = teams[m] || [];
                if (!mPlayers.length) html += `<li style="color:#475569; font-style:italic;">Sin fichajes</li>`;
                else mPlayers.forEach(p => html += `<li>${p.player} [${p.pos}]</li>`);
                grid.innerHTML += html + '</ul></div>';
            });
        }

        function renderHistory() {
            let container = document.getElementById('draft-history'); container.innerHTML = "";
            if (history.length <= 1) { container.innerHTML = "<p style='color:#475569; font-size:11px;'>Esperando elecciones...</p>"; return; }
            history.forEach(p => {
                if (p.manager === "Comisionado") return;
                let div = document.createElement('div'); div.className = "history-item";
                div.innerHTML = `<strong>${p.manager}</strong> ficha a <span style="color:#38bdf8">${p.name}</span> (R${p.round})`;
                container.appendChild(div);
            });
        }

        window.onload = function() {
            let saved = localStorage.getItem('firme_backup_liga');
            if (saved) loadFromObject(JSON.parse(saved));
        }
    </script>
</body>
</html>
